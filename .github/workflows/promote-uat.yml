name: Promote to UAT

on:
  push:
    tags:
      - 'RC*'
  workflow_run:
    workflows: ["Deploy Dev to EKS"]
    types: [completed]
    branches: [master, main]

concurrency:
  group: promote-uat
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  # UAT runs as a logically isolated namespace on the shared non-prod EKS/RDS
  # tier. Production remains physically isolated on its own cluster and RDS.
  UAT_CLUSTER: samosachaat-dev-eks
  UAT_NAMESPACE: samosachaat-uat
  SERVICES: frontend auth chat-api inference

jobs:
  promote:
    name: Re-tag tested image → UAT and deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
            short_sha="$(printf '%s' "$head_sha" | cut -c1-7)"
            echo "source=dev-${head_sha}" >> "$GITHUB_OUTPUT"
            echo "name=merge-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "source=qa-latest" >> "$GITHUB_OUTPUT"
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Re-tag source images as uat-${{ steps.tag.outputs.name }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SRC_REF: ${{ steps.tag.outputs.source }}
          DST_REF: uat-${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            repo="samosachaat/${svc}"
            echo "Re-tagging $repo:$SRC_REF -> $repo:$DST_REF"
            src_digest=""
            manifest=""
            for attempt in $(seq 1 12); do
              src_digest=$(aws ecr batch-get-image \
                --repository-name "$repo" \
                --image-ids imageTag="$SRC_REF" \
                --query 'images[0].imageId.imageDigest' \
                --output text 2>/dev/null || true)
              manifest=$(aws ecr batch-get-image \
                --repository-name "$repo" \
                --image-ids imageTag="$SRC_REF" \
                --query 'images[0].imageManifest' \
                --output text 2>/dev/null || true)
              if [ -n "$src_digest" ] && [ "$src_digest" != "None" ] && [ -n "$manifest" ] && [ "$manifest" != "None" ]; then
                break
              fi
              echo "Waiting for source image $repo:$SRC_REF to become visible in ECR ($attempt/12)"
              sleep 10
            done
            if [ -z "$src_digest" ] || [ "$src_digest" = "None" ] || [ -z "$manifest" ] || [ "$manifest" = "None" ]; then
              echo "Missing source image $repo:$SRC_REF" >&2
              exit 1
            fi
            dst_digest=$(aws ecr batch-get-image \
              --repository-name "$repo" \
              --image-ids imageTag="$DST_REF" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)
            if [ "$dst_digest" = "$src_digest" ]; then
              echo "$repo:$DST_REF already points to $src_digest; skipping"
            elif [ -n "$dst_digest" ] && [ "$dst_digest" != "None" ]; then
              echo "Destination image $repo:$DST_REF exists with a different digest: $dst_digest" >&2
              exit 1
            else
              aws ecr put-image \
                --repository-name "$repo" \
                --image-tag "$DST_REF" \
                --image-manifest "$manifest" >/dev/null
            fi
            latest_digest=$(aws ecr batch-get-image \
              --repository-name "$repo" \
              --image-ids imageTag="uat-latest" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)
            if [ "$latest_digest" = "$src_digest" ]; then
              echo "$repo:uat-latest already points to $src_digest; skipping"
            else
              aws ecr put-image \
                --repository-name "$repo" \
                --image-tag "uat-latest" \
                --image-manifest "$manifest" >/dev/null
            fi
          done

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$UAT_CLUSTER" \
            --region "$AWS_REGION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Sync database and runtime secrets
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID || secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET || secrets.GITHUB_CLIENT_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/sync-runtime-env.sh uat

      - name: Resolve Terraform deployment outputs
        id: tf
        run: |
          echo "acm_cert_arn=$(terraform -chdir=terraform/environments/dev output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
          echo "alb_controller_role_arn=$(terraform -chdir=terraform/environments/dev output -raw alb_controller_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Install cluster add-ons
        run: ./scripts/install-cluster-addons.sh "$UAT_CLUSTER" "${{ steps.tf.outputs.alb_controller_role_arn }}"

      - name: Helm upgrade (UAT)
        run: |
          helm upgrade --install samosachaat helm/samosachaat \
            -f helm/samosachaat/values-uat.yaml \
            --set global.imageRegistry="${{ steps.ecr-login.outputs.registry }}" \
            --set global.imageTag=uat-${{ steps.tag.outputs.name }} \
            --set ingress.acmCertArn="${{ steps.tf.outputs.acm_cert_arn }}" \
            --set secrets.create=false \
            --namespace "$UAT_NAMESPACE" \
            --create-namespace \
            --wait --timeout 10m

      - name: Reconcile DNS aliases through Terraform
        run: ./scripts/reconcile-route53-alias.sh uat

      - name: Smoke test UAT
        run: ./scripts/smoke-test-k8s.sh "$UAT_NAMESPACE"

      - name: Smoke test public UAT endpoint
        run: ./scripts/smoke-test-external.sh uat
