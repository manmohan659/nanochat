name: Terraform Apply

on:
  push:
    branches: [master, main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

jobs:
  apply-dev:
    name: Apply shared non-prod infrastructure
    if: vars.TERRAFORM_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      github_actions_role_arn: ${{ steps.outputs.outputs.github_actions_role_arn }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Terraform apply dev
        run: |
          terraform -chdir=terraform/environments/dev init -input=false
          terraform -chdir=terraform/environments/dev apply -input=false -auto-approve

      - name: Capture outputs
        id: outputs
        run: |
          echo "github_actions_role_arn=$(terraform -chdir=terraform/environments/dev output -raw github_actions_role_arn)" >> "$GITHUB_OUTPUT"

  apply-uat-metadata:
    name: Apply UAT logical-environment metadata
    if: vars.TERRAFORM_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: apply-dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Terraform apply UAT metadata
        run: |
          terraform -chdir=terraform/environments/uat init -input=false
          terraform -chdir=terraform/environments/uat apply -input=false -auto-approve

  apply-prod:
    name: Apply production infrastructure
    if: vars.TERRAFORM_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: apply-dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Terraform apply prod
        env:
          GITHUB_ACTIONS_ROLE_ARN: ${{ needs.apply-dev.outputs.github_actions_role_arn }}
        run: |
          terraform -chdir=terraform/environments/prod init -input=false
          terraform -chdir=terraform/environments/prod apply \
            -input=false \
            -auto-approve \
            -var="github_actions_role_arn=${GITHUB_ACTIONS_ROLE_ARN}"
