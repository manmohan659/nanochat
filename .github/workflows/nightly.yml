name: Nightly QA Build

on:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: nightly-qa
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  # QA runs in the shared non-prod cluster with its own namespace and logical DB.
  QA_CLUSTER: ${{ vars.QA_CLUSTER || 'samosachaat-dev-eks' }}
  QA_NAMESPACE: samosachaat-qa
  IMAGE_TAG: qa-${{ github.sha }}

jobs:
  build:
    name: Build QA ${{ matrix.service }}
    if: vars.EKS_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile
          - service: auth
            context: services/auth
            dockerfile: services/auth/Dockerfile
          - service: chat-api
            context: .
            dockerfile: services/chat-api/Dockerfile
          - service: inference
            context: services/inference
            dockerfile: services/inference/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push QA image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/samosachaat/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/samosachaat/${{ matrix.service }}:qa-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-qa:
    name: Deploy QA namespace
    if: vars.EKS_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$QA_CLUSTER" \
            --region "$AWS_REGION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Sync database and runtime secrets
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID || secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET || secrets.GITHUB_CLIENT_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/sync-runtime-env.sh qa

      - name: Resolve deployment config
        id: tf
        env:
          ACM_CERT_ARN: ${{ vars.NONPROD_ACM_CERT_ARN }}
          ALB_CONTROLLER_ROLE_ARN: ${{ vars.NONPROD_ALB_CONTROLLER_ROLE_ARN }}
        run: |
          : "${ACM_CERT_ARN:?Missing repo variable NONPROD_ACM_CERT_ARN}"
          : "${ALB_CONTROLLER_ROLE_ARN:?Missing repo variable NONPROD_ALB_CONTROLLER_ROLE_ARN}"
          echo "acm_cert_arn=${ACM_CERT_ARN}" >> "$GITHUB_OUTPUT"
          echo "alb_controller_role_arn=${ALB_CONTROLLER_ROLE_ARN}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Install cluster add-ons
        run: ./scripts/install-cluster-addons.sh "$QA_CLUSTER" "${{ steps.tf.outputs.alb_controller_role_arn }}"

      - name: Helm upgrade QA
        run: |
          helm upgrade --install samosachaat helm/samosachaat \
            -f helm/samosachaat/values-qa.yaml \
            --set global.imageRegistry="${{ steps.ecr-login.outputs.registry }}" \
            --set global.imageTag="${IMAGE_TAG}" \
            --set ingress.acmCertArn="${{ steps.tf.outputs.acm_cert_arn }}" \
            --set secrets.create=false \
            --namespace "$QA_NAMESPACE" \
            --create-namespace \
            --wait --timeout 10m

      - name: Reconcile DNS aliases through Terraform
        if: vars.TERRAFORM_APPLY_ENABLED == 'true'
        run: ./scripts/reconcile-route53-alias.sh qa

      - name: Smoke test QA
        run: ./scripts/smoke-test-k8s.sh "$QA_NAMESPACE"

      - name: Smoke test public QA endpoint
        run: ./scripts/smoke-test-external.sh qa
