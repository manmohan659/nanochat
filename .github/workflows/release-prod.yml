name: Release to Prod (Blue/Green)

on:
  push:
    tags:
      - 'v*'
      - '!v*-*'

concurrency:
  group: release-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  PROD_CLUSTER: samosachaat-prod-eks
  PROD_NAMESPACE: samosachaat-prod
  SERVICES: frontend auth chat-api inference

jobs:
  release:
    name: Blue/Green release ${{ github.ref_name }}
    if: vars.EKS_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "Expected a stable semver tag like v1.0.4, got: $tag" >&2
            exit 1
          fi
          commit_sha="$(git rev-list -n 1 "$tag")"
          short_sha="$(printf '%s' "$commit_sha" | cut -c1-7)"
          echo "name=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "uat_source=uat-merge-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve UAT source tag
        id: uat
        run: |
          set -euo pipefail
          echo "source=${{ steps.tag.outputs.uat_source }}" >> "$GITHUB_OUTPUT"

      - name: Promote uat images to prod tag
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SRC_REF: ${{ steps.uat.outputs.source }}
          DST_REF: prod-${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            repo="samosachaat/${svc}"
            echo "Promoting $repo:$SRC_REF -> $repo:$DST_REF"
            src_digest=""
            manifest=""
            for attempt in $(seq 1 12); do
              src_digest=$(aws ecr batch-get-image \
                --repository-name "$repo" \
                --image-ids imageTag="$SRC_REF" \
                --query 'images[0].imageId.imageDigest' \
                --output text 2>/dev/null || true)
              manifest=$(aws ecr batch-get-image \
                --repository-name "$repo" \
                --image-ids imageTag="$SRC_REF" \
                --query 'images[0].imageManifest' \
                --output text 2>/dev/null || true)
              if [ -n "$src_digest" ] && [ "$src_digest" != "None" ] && [ -n "$manifest" ] && [ "$manifest" != "None" ]; then
                break
              fi
              echo "Waiting for source image $repo:$SRC_REF to become visible in ECR ($attempt/12)"
              sleep 10
            done
            if [ -z "$src_digest" ] || [ "$src_digest" = "None" ] || [ -z "$manifest" ] || [ "$manifest" = "None" ]; then
              echo "Missing UAT source image $repo:$SRC_REF" >&2
              exit 1
            fi
            dst_digest=$(aws ecr batch-get-image \
              --repository-name "$repo" \
              --image-ids imageTag="$DST_REF" \
              --query 'images[0].imageId.imageDigest' \
              --output text 2>/dev/null || true)
            if [ "$dst_digest" = "$src_digest" ]; then
              echo "$repo:$DST_REF already points to $src_digest; skipping"
              continue
            fi
            if [ -n "$dst_digest" ] && [ "$dst_digest" != "None" ]; then
              echo "Destination image $repo:$DST_REF exists with a different digest: $dst_digest" >&2
              exit 1
            fi
            aws ecr put-image \
              --repository-name "$repo" \
              --image-tag "$DST_REF" \
              --image-manifest "$manifest" >/dev/null
          done

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$PROD_CLUSTER" \
            --region "$AWS_REGION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Sync database and runtime secrets
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID || secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET || secrets.GITHUB_CLIENT_SECRET }}
          GITHUB_GRAFANA_CLIENT_ID: ${{ secrets.OAUTH_GRAFANA_CLIENT_ID }}
          GITHUB_GRAFANA_CLIENT_SECRET: ${{ secrets.OAUTH_GRAFANA_CLIENT_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/sync-runtime-env.sh prod

      - name: Resolve deployment config
        id: tf
        env:
          ACM_CERT_ARN: ${{ vars.PROD_ACM_CERT_ARN }}
          ALB_CONTROLLER_ROLE_ARN: ${{ vars.PROD_ALB_CONTROLLER_ROLE_ARN }}
        run: |
          : "${ACM_CERT_ARN:?Missing repo variable PROD_ACM_CERT_ARN}"
          : "${ALB_CONTROLLER_ROLE_ARN:?Missing repo variable PROD_ALB_CONTROLLER_ROLE_ARN}"
          echo "acm_cert_arn=${ACM_CERT_ARN}" >> "$GITHUB_OUTPUT"
          echo "alb_controller_role_arn=${ALB_CONTROLLER_ROLE_ARN}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Install cluster add-ons
        run: ./scripts/install-cluster-addons.sh "$PROD_CLUSTER" "${{ steps.tf.outputs.alb_controller_role_arn }}"

      - name: Deploy observability stack
        run: |
          ./scripts/build-observability-dependencies.sh
          helm upgrade --install observability helm/observability \
            --namespace "$PROD_NAMESPACE" \
            --create-namespace \
            --wait --timeout 15m

      - name: Select candidate slot
        id: slot
        run: |
          set -euo pipefail
          if helm status samosachaat-traffic -n "$PROD_NAMESPACE" >/dev/null 2>&1; then
            current=$(helm get values samosachaat-traffic -n "$PROD_NAMESPACE" -o json \
              | jq -r '.ingress.targetSlot // "blue"')
          else
            current="none"
          fi
          if [ "$current" = "none" ]; then
            candidate="blue"
          elif [ "$current" = "green" ]; then
            candidate="blue"
          else
            candidate="green"
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate slot
        run: |
          helm upgrade --install samosachaat-${{ steps.slot.outputs.candidate }} helm/samosachaat \
            -f helm/samosachaat/values-prod.yaml \
            --set global.imageRegistry="${{ steps.ecr-login.outputs.registry }}" \
            --set global.imageTag=prod-${{ steps.tag.outputs.name }} \
            --set deployment.slot=${{ steps.slot.outputs.candidate }} \
            --set ingress.enabled=false \
            --set namespace.create=false \
            --set configMap.create=false \
            --set secrets.create=false \
            --namespace "$PROD_NAMESPACE" \
            --create-namespace \
            --wait --timeout 15m

      - name: Smoke test candidate
        run: ./scripts/smoke-test-k8s.sh "$PROD_NAMESPACE" "${{ steps.slot.outputs.candidate }}"

      - name: Swap ingress to candidate
        run: |
          helm upgrade --install samosachaat-traffic helm/samosachaat \
            -f helm/samosachaat/values-prod.yaml \
            --set frontend.enabled=false \
            --set auth.enabled=false \
            --set chatApi.enabled=false \
            --set inference.enabled=false \
            --set dbMigrate.enabled=false \
            --set ingress.enabled=true \
            --set ingress.targetSlot=${{ steps.slot.outputs.candidate }} \
            --set ingress.acmCertArn="${{ steps.tf.outputs.acm_cert_arn }}" \
            --set secrets.create=false \
            --namespace "$PROD_NAMESPACE" \
            --create-namespace \
            --wait --timeout 10m

      - name: Reconcile DNS aliases through Terraform
        if: vars.TERRAFORM_APPLY_ENABLED == 'true'
        env:
          GITHUB_ACTIONS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: ./scripts/reconcile-route53-alias.sh prod

      - name: Smoke test public Prod endpoint
        run: ./scripts/smoke-test-external.sh prod

      - name: Retain previous slot as rollback standby
        run: |
          echo "Active slot: ${{ steps.slot.outputs.candidate }}"
          echo "Rollback slot: ${{ steps.slot.outputs.current }}"
          if [ "${{ steps.slot.outputs.current }}" != "none" ]; then
            echo "To roll back:"
            echo "  helm upgrade samosachaat-traffic helm/samosachaat \\"
            echo "    --reuse-values \\"
            echo "    --set ingress.targetSlot=${{ steps.slot.outputs.current }} \\"
            echo "    --namespace $PROD_NAMESPACE"
          fi
