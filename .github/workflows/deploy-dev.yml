name: Deploy Dev to EKS

on:
  workflow_run:
    workflows: ["Build & Push Dev Images"]
    types: [completed]
    branches: [master, main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  DEV_CLUSTER: samosachaat-dev-eks
  DEV_NAMESPACE: samosachaat-dev

jobs:
  deploy:
    name: Deploy merged image set to dev
    if: github.event.workflow_run.conclusion == 'success' && vars.EKS_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$DEV_CLUSTER" \
            --region "$AWS_REGION"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Sync database and runtime secrets
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID || secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET || secrets.GITHUB_CLIENT_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/sync-runtime-env.sh dev

      - name: Resolve Terraform deployment outputs
        id: tf
        run: |
          echo "acm_cert_arn=$(terraform -chdir=terraform/environments/dev output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"
          echo "alb_controller_role_arn=$(terraform -chdir=terraform/environments/dev output -raw alb_controller_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Install cluster add-ons
        run: ./scripts/install-cluster-addons.sh "$DEV_CLUSTER" "${{ steps.tf.outputs.alb_controller_role_arn }}"

      - name: Helm upgrade Dev
        env:
          IMAGE_TAG: dev-${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install samosachaat helm/samosachaat \
            -f helm/samosachaat/values-dev.yaml \
            --set global.imageRegistry="${{ steps.ecr-login.outputs.registry }}" \
            --set global.imageTag="${IMAGE_TAG}" \
            --set ingress.acmCertArn="${{ steps.tf.outputs.acm_cert_arn }}" \
            --set secrets.create=false \
            --namespace "$DEV_NAMESPACE" \
            --create-namespace \
            --wait --timeout 10m

      - name: Reconcile DNS aliases through Terraform
        run: ./scripts/reconcile-route53-alias.sh dev

      - name: Smoke test Dev
        run: ./scripts/smoke-test-k8s.sh "$DEV_NAMESPACE"

      - name: Smoke test public Dev endpoint
        run: ./scripts/smoke-test-external.sh dev
