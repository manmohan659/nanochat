## UAT overrides — 2 replicas each, medium resources.

namespace:
  name: samosachaat-uat

config:
  ENVIRONMENT: "uat"
  LOG_LEVEL: "info"

frontend:
  replicaCount: 2
  env:
    NEXT_PUBLIC_API_URL: "https://uat.samosachaat.art/api"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

auth:
  replicaCount: 2
  env:
    FRONTEND_URL: "https://uat.samosachaat.art"
    AUTH_BASE_URL: "https://uat.samosachaat.art"
    COOKIE_SECURE: "true"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

chatApi:
  replicaCount: 2
  env:
    FRONTEND_URL: "https://uat.samosachaat.art"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  hpa:
    enabled: false

inference:
  replicaCount: 2
  env:
    UPSTREAM_GENERATE_URL: "https://manmohan659--samosachaat-inference-inference-generate.modal.run"
    UPSTREAM_READ_TIMEOUT_SECONDS: "60"
    DEMO_FALLBACK_ENABLED: "true"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 4Gi
  hpa:
    enabled: false

pdb:
  enabled: true
  minAvailable: 1

ingress:
  host: uat.samosachaat.art
  grafana:
    enabled: false
