## QA overrides — cost-aware nightly integration gate on shared non-prod EKS.

global:
  imageTag: qa-latest

namespace:
  name: samosachaat-qa

config:
  ENVIRONMENT: "qa"
  LOG_LEVEL: "info"

frontend:
  replicaCount: 2
  env:
    NEXT_PUBLIC_API_URL: "https://qa.samosachaat.art/api"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

auth:
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

chatApi:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: false

inference:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 2Gi
  hpa:
    enabled: false

pdb:
  enabled: true
  minAvailable: 1

ingress:
  host: qa.samosachaat.art
  groupName: samosachaat-nonprod
  grafana:
    enabled: false
