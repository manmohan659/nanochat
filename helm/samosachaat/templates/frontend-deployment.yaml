{{- if .Values.frontend.enabled -}}
{{- $svcName := include "samosachaat.svcName" (dict "root" . "svc" "frontend") -}}
{{- $authSvcName := include "samosachaat.svcName" (dict "root" . "svc" "auth") -}}
{{- $chatApiSvcName := include "samosachaat.svcName" (dict "root" . "svc" "chat-api") -}}
{{- $inferenceSvcName := include "samosachaat.svcName" (dict "root" . "svc" "inference") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  namespace: {{ include "samosachaat.namespace" . }}
  labels:
    {{- include "samosachaat.labels" . | nindent 4 }}
    {{- include "samosachaat.selectorLabels" (dict "root" . "svc" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "samosachaat.selectorLabels" (dict "root" . "svc" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "samosachaat.selectorLabels" (dict "root" . "svc" "frontend") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 90
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "samosachaat.selectorLabels" (dict "root" . "svc" "frontend") | nindent 14 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "samosachaat.image" (dict "root" . "svc" .Values.frontend) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 30"]
          envFrom:
            - configMapRef:
                name: samosachaat-config
                optional: true
            - secretRef:
                name: samosachaat-secrets
                optional: true
          env:
            - name: AUTH_SERVICE_URL
              value: {{ printf "http://%s:%v" $authSvcName (int .Values.auth.port) | quote }}
            - name: CHAT_API_URL
              value: {{ printf "http://%s:%v" $chatApiSvcName (int .Values.chatApi.port) | quote }}
            - name: INFERENCE_SERVICE_URL
              value: {{ printf "http://%s:%v" $inferenceSvcName (int .Values.inference.port) | quote }}
          {{- with .Values.frontend.env }}
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
