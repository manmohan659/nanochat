{{- if .Values.ingress.enabled -}}
{{- $targetSlot := default .Values.deployment.slot .Values.ingress.targetSlot -}}
{{- $frontendSvc := include "samosachaat.svcNameForSlot" (dict "svc" "frontend" "slot" $targetSlot) -}}
{{- $authSvc := include "samosachaat.svcNameForSlot" (dict "svc" "auth" "slot" $targetSlot) -}}
{{- $chatApiSvc := include "samosachaat.svcNameForSlot" (dict "svc" "chat-api" "slot" $targetSlot) -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- $grafana := get $ingress "grafana" | default dict -}}
{{- $lokiPush := get $ingress "lokiPush" | default dict -}}
{{- $grafanaEnabled := get $grafana "enabled" | default true -}}
{{- $grafanaHost := get $grafana "host" | default (.Values.ingress.grafanaHost | default "grafana.samosachaat.art") -}}
{{- $grafanaServiceName := get $grafana "serviceName" | default (.Values.ingress.grafanaServiceName | default "grafana") -}}
{{- $grafanaServicePort := get $grafana "servicePort" | default (.Values.ingress.grafanaServicePort | default 3000) -}}
{{- $lokiPushEnabled := get $lokiPush "enabled" | default false -}}
{{- $lokiPushHost := get $lokiPush "host" | default $grafanaHost -}}
{{- $lokiPushPath := get $lokiPush "path" | default "/loki/api/v1/push" -}}
{{- $lokiPushServiceName := get $lokiPush "serviceName" | default "observability-loki" -}}
{{- $lokiPushServicePort := get $lokiPush "servicePort" | default 3100 -}}
{{- $lokiPushSourceCidrs := get $lokiPush "sourceCidrs" | default list -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: samosachaat
  namespace: {{ include "samosachaat.namespace" . }}
  labels:
    {{- include "samosachaat.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    {{- with .Values.ingress.acmCertArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
    {{- if and $lokiPushEnabled $lokiPushSourceCidrs }}
    alb.ingress.kubernetes.io/conditions.{{ $lokiPushServiceName }}: {{ list (dict "field" "source-ip" "sourceIpConfig" (dict "values" $lokiPushSourceCidrs)) | toJson | quote }}
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ $authSvc }}
                port:
                  number: {{ .Values.auth.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ $chatApiSvc }}
                port:
                  number: {{ .Values.chatApi.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $frontendSvc }}
                port:
                  number: {{ .Values.frontend.port }}
    {{- if $grafanaEnabled }}
    - host: {{ $grafanaHost | quote }}
      http:
        paths:
          {{- if and $lokiPushEnabled (eq $lokiPushHost $grafanaHost) }}
          - path: {{ $lokiPushPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $lokiPushServiceName }}
                port:
                  number: {{ $lokiPushServicePort }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $grafanaServiceName }}
                port:
                  number: {{ $grafanaServicePort }}
    {{- end }}
    {{- if and $lokiPushEnabled (or (not $grafanaEnabled) (ne $lokiPushHost $grafanaHost)) }}
    - host: {{ $lokiPushHost | quote }}
      http:
        paths:
          - path: {{ $lokiPushPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $lokiPushServiceName }}
                port:
                  number: {{ $lokiPushServicePort }}
    {{- end }}
{{- end }}
