## Dev overrides — single-slot, two replicas, small resources, no HPA.

global:
  imageTag: dev-latest

namespace:
  name: samosachaat-dev

config:
  ENVIRONMENT: "dev"
  LOG_LEVEL: "debug"

frontend:
  replicaCount: 2
  env:
    NEXT_PUBLIC_API_URL: "https://dev.samosachaat.art/api"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

auth:
  replicaCount: 2
  env:
    FRONTEND_URL: "https://dev.samosachaat.art"
    AUTH_BASE_URL: "https://dev.samosachaat.art"
    COOKIE_SECURE: "true"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

chatApi:
  replicaCount: 2
  env:
    FRONTEND_URL: "https://dev.samosachaat.art"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: false

inference:
  replicaCount: 2
  env:
    UPSTREAM_GENERATE_URL: "https://manmohan659--samosachaat-inference-inference-generate.modal.run"
    UPSTREAM_READ_TIMEOUT_SECONDS: "60"
    DEMO_FALLBACK_ENABLED: "true"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 2Gi
  hpa:
    enabled: false

pdb:
  enabled: true
  minAvailable: 1

ingress:
  host: dev.samosachaat.art
  groupName: samosachaat-nonprod
  grafana:
    enabled: false
