{{/*
ConfigMap that carries every dashboard JSON from helm/observability/dashboards/
into Grafana. The kube-prometheus-stack Grafana deployment mounts ConfigMaps
listed under grafana.dashboardsConfigMaps (see values.yaml) at
/var/lib/grafana/dashboards/<key>/, which the matching dashboardProvider picks
up and loads.
*/}}
{{- $kps := index .Values "kube-prometheus-stack" | default dict -}}
{{- $grafana := get $kps "grafana" | default dict -}}
{{- $kpsEnabled := true -}}
{{- if hasKey $kps "enabled" -}}
{{- $kpsEnabled = get $kps "enabled" -}}
{{- end -}}
{{- $grafanaEnabled := true -}}
{{- if hasKey $grafana "enabled" -}}
{{- $grafanaEnabled = get $grafana "enabled" -}}
{{- end -}}
{{- if and $kpsEnabled $grafanaEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: samosachaat-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: samosachaat
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
